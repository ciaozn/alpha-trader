# Alpha Trader on a VPS (T407): the application plus the MySQL 8 it writes to.
#
# Copy .env.example to .env, fill it in, then: docker compose up -d
# The .env file is gitignored; nothing secret belongs in this file.
#
# Why the app waits for MySQL's health rather than just starting after it: the business store is
# opened at startup and its six tables are created there, so "the database is not accepting
# connections yet" is a startup failure rather than something to retry later.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alpha_trader
      MYSQL_USER: ${ALPHA_DB_USER:-alpha}
      MYSQL_PASSWORD: ${ALPHA_DB_PASSWORD:?set ALPHA_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ALPHA_DB_ROOT_PASSWORD:?set ALPHA_DB_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      # utf8mb4 because the signal "reason" column carries exchange text, and UTC because every
      # timestamp in this system is epoch millis that must mean the same thing on both sides.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${ALPHA_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # paper first, live only after T409's seven clean days (SC-03).
      SPRING_PROFILES_ACTIVE: ${ALPHA_PROFILE:-paper}
      ALPHA_MODE: ${ALPHA_PROFILE:-paper}
      # Testnet by default. Flipping this to false places real orders with real money.
      ALPHA_BINANCE_TESTNET: ${ALPHA_BINANCE_TESTNET:-true}
      ALPHA_TRADING_ENABLED: ${ALPHA_TRADING_ENABLED:-false}
      ALPHA_STORE_JDBC_URL: jdbc:mysql://mysql:3306/alpha_trader?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      ALPHA_DB_USER: ${ALPHA_DB_USER:-alpha}
      ALPHA_DB_PASSWORD: ${ALPHA_DB_PASSWORD:?set ALPHA_DB_PASSWORD in .env}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-ciaozn@qq.com}
      ALERT_SMTP_AUTH_CODE: ${ALERT_SMTP_AUTH_CODE:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ciaozn@qq.com}
      # The JVM takes its timezone from here; every wall-clock log line should read UTC.
      TZ: UTC
    ports:
      # Only the status endpoint (FR-OP-02). Bind it to localhost and reach it through SSH: it
      # reports positions and equity, which is not something to expose on a public interface.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  mysql-data:
